name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: napi_geoai
          POSTGRES_USER: napi
          POSTGRES_PASSWORD: napi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U napi -d napi_geoai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://napi:napi_ci@localhost:5432/napi_geoai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,db]"

      - name: Install PostgreSQL 16 client (match PostGIS service major)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          # Preferir binários 16 no PATH (evita pg_dump mais novo → SET transaction_timeout).
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: Verify pg_dump/pg_restore major matches server (16)
        run: |
          set -euo pipefail
          pg_dump --version
          pg_restore --version
          python - <<'PY'
          import os, re, subprocess
          import psycopg
          url = os.environ["DATABASE_URL"]
          with psycopg.connect(url) as conn:
              with conn.cursor() as cur:
                  cur.execute("SHOW server_version_num")
                  server_num = int(cur.fetchone()[0])
          server_major = server_num // 10000
          for tool in ("pg_dump", "pg_restore"):
              out = subprocess.check_output([tool, "--version"], text=True)
              m = re.search(r"(\d+)\.\d+", out)
              assert m, out
              client_major = int(m.group(1))
              print(f"{tool}: {out.strip()} (major={client_major})")
              if client_major != server_major:
                  raise SystemExit(
                      f"{tool} major {client_major} != server major {server_major}"
                  )
          print(f"OK: client/server major={server_major}")
          PY

      - name: Ruff
        run: ruff check .

      - name: Pytest (unit + PostGIS + ops)
        run: pytest -q

      # QGIS Desktop / QGIS MCP are intentionally not executed in CI.
      # Conta Supabase remota não é usada neste workflow.
