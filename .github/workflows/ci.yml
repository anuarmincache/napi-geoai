name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: napi_geoai
          POSTGRES_USER: napi
          POSTGRES_PASSWORD: napi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U napi -d napi_geoai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://napi:napi_ci@localhost:5432/napi_geoai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,db]"

      - name: Install PostgreSQL client (backup/restore tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Ruff
        run: ruff check .

      - name: Pytest (unit + PostGIS + ops)
        run: pytest -q

      # QGIS Desktop / QGIS MCP are intentionally not executed in CI.
      # Conta Supabase remota não é usada neste workflow.
