# Configuração Streamlit — local e Community Cloud (MVP 08).
# Sem segredos. Não altera o motor científico.

[server]
headless = true
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = true

[theme]
base = "light"
primaryColor = "#1f4e79"
backgroundColor = "#f4f7fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#0b2545"
font = "sans serif"
