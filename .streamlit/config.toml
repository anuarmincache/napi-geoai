# Configuração Streamlit — local e Community Cloud (MVP 08).
# Sem segredos. Não altera o motor científico.
#
# CORS/XSRF: defaults seguros da plataforma.
# - enableCORS omitido → default true (compatível com embeds/Cloud).
# - enableXsrfProtection true → proteção CSRF mantida (default Streamlit).

[server]
headless = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showSidebarNavigation = false
showErrorDetails = true

[theme]
base = "light"
primaryColor = "#4a7a26"
backgroundColor = "#f6f8f3"
secondaryBackgroundColor = "#ffffff"
textColor = "#1f2a24"
font = "sans serif"
